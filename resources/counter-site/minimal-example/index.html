<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>County McCounterson</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <h1 class="boxed">Make Number Go Up</h1>
    <p class="boxed">
      <span>Current count: </span>
      <span id="counter-output">0</p>
    <button class="boxed" id="incr-count">Click Me!</button>
    <label for="dividend" id="dividend-label" class="boxed"
      >Input a number!</label
    >
    <input class="boxed" type="number" id="dividend" />
    <p class="boxed">
      <span>Result: </span>
      <span id="result-output">0<span>
    </p>
  </body>
  <script type="module" src="./index.js"></script>
</html>
